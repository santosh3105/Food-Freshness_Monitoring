services:
  - type: web
    name: food-freshness-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    disk:
      name: food-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: food_freshness_db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"
